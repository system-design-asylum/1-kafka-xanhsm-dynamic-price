services:
  grid-database:
    image: postgis/postgis:latest
    container_name: grid-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grid_db
    ports:
      - "5432:5432"
    volumes:
      - grid-db-data:/var/lib/postgresql/data

  broker:
    image: apache/kafka:4.0.0 # Or use confluentinc/cp-kafka for more features
    hostname: broker
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      # If using an older Kafka version that still needs Zookeeper (e.g., < Kafka 3.0), you'd add:
      # KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # For single broker
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: '68dce805-77e3-4be4-b182-550739e47fc9'
    volumes:
      - kafka-data:/var/lib/kafka/data # Persist data
volumes:
  kafka-data:
    driver: local
  grid-db-data:
    driver: local